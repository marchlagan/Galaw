<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAW! — Geography of Movement Trivia Race</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #070d1a;
    --surface: #0e1a2e;
    --surface2: #162035;
    --border: #1e3050;
    --p1: #ff5f5f;
    --p2: #3ecfb8;
    --p3: #ffc93c;
    --gold: #ffc93c;
    --muted: #4a6080;
    --text: #cdd9ef;
    --white: #ffffff;
    --green: #22c55e;
    --red: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  h1, .bebas { font-family: 'Bebas Neue', sans-serif; }

  /* ── SETUP ── */
  #setup {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px;
    background: radial-gradient(ellipse at 30% 20%, #0d2a4a 0%, var(--bg) 70%);
  }

  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; color: var(--gold); letter-spacing: 12px; line-height: 1; }
  .logo-sub { color: var(--muted); font-size: 0.78rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 36px; }

  .setup-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; width: 100%; max-width: 400px;
  }
  .section-label { font-size: 0.68rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .player-toggle { display: flex; gap: 8px; margin-bottom: 24px; }
  .toggle-btn {
    flex: 1; padding: 11px; border-radius: 8px; border: 1.5px solid var(--border);
    background: transparent; color: var(--muted); font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem; letter-spacing: 2px; cursor: pointer; transition: all 0.2s;
  }
  .toggle-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(255,201,60,0.08); }

  .name-row { margin-bottom: 12px; }
  .name-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .name-label { font-size: 0.7rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
  .name-input {
    width: 100%; padding: 9px 13px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none;
  }
  .name-input:focus { border-color: var(--gold); }

  .start-btn {
    width: 100%; margin-top: 12px; padding: 14px;
    background: var(--gold); color: var(--bg);
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 4px;
    border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.2s;
  }
  .start-btn:hover { opacity: 0.9; }

  .how-to {
    margin-top: 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; max-width: 400px; width: 100%;
    font-size: 0.82rem; color: var(--muted); line-height: 2;
  }
  .how-to strong { color: var(--text); display: block; margin-bottom: 4px; }

  /* ── GAME ── */
  #game { display: none; flex-direction: column; height: 100vh; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0; gap: 12px;
  }
  .game-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold); letter-spacing: 4px; }

  .player-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .p-chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 11px;
    border-radius: 20px; border: 1.5px solid var(--border);
    font-size: 0.78rem; transition: all 0.3s;
  }
  .p-chip.active { background: rgba(255,255,255,0.05); }
  .p-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-chip-name { font-weight: 600; }
  .p-chip-loc { color: var(--muted); font-size: 0.7rem; }

  .main-area { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  .map-panel { width: 255px; min-width: 255px; padding: 10px; flex-shrink: 0; }
  .map-panel svg { width: 100%; height: 100%; }

  .right-panel { flex: 1; padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

  .turn-banner {
    padding: 11px 15px; border-radius: 10px;
    background: var(--surface2); border-left: 4px solid #fff;
    display: flex; align-items: center; gap: 12px;
  }
  .turn-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--bg); flex-shrink: 0;
  }
  .turn-label { font-size: 0.65rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .turn-name { font-weight: 700; font-size: 1rem; }
  .turn-progress { margin-left: auto; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

  .draw-btn {
    padding: 20px; border-radius: 14px; border: none;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 3px;
    cursor: pointer; transition: transform 0.15s, opacity 0.15s; color: var(--bg);
  }
  .draw-btn:hover { transform: scale(1.02); }
  .draw-btn:active { transform: scale(0.98); }

  .surprise-badge {
    padding: 8px 14px; border-radius: 8px; text-align: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px;
    background: linear-gradient(135deg, #5b21b6, #7c3aed); color: #fff;
  }
  .steal-badge {
    padding: 8px 14px; border-radius: 8px; text-align: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 2px;
    background: linear-gradient(135deg, #92400e, #d97706); color: #fff;
  }

  .q-box {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 15px 17px;
    line-height: 1.65; font-size: 0.92rem;
  }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    padding: 10px 13px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--surface2);
    color: var(--text); text-align: left; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
    display: flex; align-items: center; gap: 10px;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(255,201,60,0.05); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { border-color: #16a34a; background: #052e16; color: #4ade80; }
  .opt-btn.wrong { border-color: #dc2626; background: #2d0707; color: #f87171; }

  .opt-letter {
    min-width: 24px; height: 24px; border-radius: 50%;
    background: var(--border); display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
  }

  .feedback {
    padding: 11px 14px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    font-size: 0.88rem; line-height: 1.6;
  }
  .feedback.good { color: #4ade80; border-color: #16a34a33; }
  .feedback.bad { color: #f87171; border-color: #dc262633; }
  .feedback .note { color: var(--muted); font-size: 0.8rem; margin-top: 5px; }

  .win-banner {
    padding: 16px; border-radius: 12px; text-align: center;
    border: 2px solid; margin-top: 4px;
  }
  .win-banner .trophy { font-size: 2rem; }
  .win-banner .win-text { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; }

  .next-btn {
    padding: 13px; border-radius: 10px; border: none;
    background: var(--gold); color: var(--bg);
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 3px;
    cursor: pointer; width: 100%; transition: opacity 0.2s;
  }
  .next-btn:hover { opacity: 0.9; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- ══ SETUP SCREEN ══════════════════════════════════════════ -->
<div id="setup">
  <div class="logo">GALAW!</div>
  <div class="logo-sub">Geography of Movement · Trivia Race</div>
  
  <div class="setup-card">
    <div class="section-label">Number of Players</div>
    <div class="player-toggle">
      <button class="toggle-btn active" id="btn2" onclick="setPlayers(2)">2 Players</button>
      <button class="toggle-btn" id="btn3" onclick="setPlayers(3)">3 Players</button>
    </div>

    <div id="nameFields">
      <div class="name-row">
        <label class="name-label"><span class="name-dot" style="background:var(--p1)"></span>Player 1 Name</label>
        <input class="name-input" id="n0" value="Player 1" />
      </div>
      <div class="name-row">
        <label class="name-label"><span class="name-dot" style="background:var(--p2)"></span>Player 2 Name</label>
        <input class="name-input" id="n1" value="Player 2" />
      </div>
      <div class="name-row" id="p3row" style="display:none">
        <label class="name-label"><span class="name-dot" style="background:var(--p3)"></span>Player 3 Name</label>
        <input class="name-input" id="n2" value="Player 3" />
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">🚦 START RACE</button>
  </div>

  <div class="how-to">
    <strong>HOW TO PLAY</strong>
    ✅ Correct answer → move 1 stop forward<br>
    ❌ Wrong answer → other players can steal (+1 stop)<br>
    ⚡ Surprise Round: Correct = +2 stops | Wrong = −1 stop<br>
    🏁 First jeepney to reach Manila wins!
  </div>
</div>

<!-- ══ GAME SCREEN ════════════════════════════════════════════ -->
<div id="game">
  <div class="topbar">
    <span class="game-logo">🚌 GALAW!</span>
    <div class="player-chips" id="chips"></div>
  </div>

  <div class="main-area">
    <div class="map-panel">
      <svg id="mapSvg" viewBox="0 0 310 500" xmlns="http://www.w3.org/2000/svg">
        <rect width="310" height="500" fill="#061222" rx="6"/>
        <g fill="#1a6b42" stroke="#0d4a2e" stroke-width="0.7" opacity="0.95">
          <polygon points="58,252 78,245 88,260 80,292 58,330 42,338 38,328 52,295 55,268"/>
          <polygon points="105,255 142,248 158,264 150,285 122,290 106,278"/>
          <polygon points="158,258 185,250 198,275 188,305 165,308 152,288"/>
          <polygon points="195,258 212,255 218,282 210,310 195,312 188,286"/>
          <polygon points="225,252 245,248 252,272 242,298 225,298 218,275"/>
          <polygon points="248,248 265,244 268,265 258,278 246,270"/>
          <polygon points="185,312 210,308 212,325 198,332 182,326"/>
          <polygon points="105,15 125,8 150,12 175,22 205,35 225,62 232,95 228,125 215,150 202,170 185,195 162,210 142,212 122,202 108,182 96,158 88,130 90,100 96,70 102,42"/>
          <polygon points="142,348 168,340 198,338 228,342 255,355 272,375 270,405 258,430 242,452 220,462 195,460 172,450 155,432 142,408 138,382 140,360"/>
        </g>
        <polyline id="routeLine" fill="none" stroke="#ffc93c" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>

        <g id="playerPieces"></g>
      </svg>
    </div>

    <div class="right-panel" id="rightPanel"></div>
  </div>
</div>

<script>
const STOPS = [
  { name: "General Santos", x: 225, y: 458 },
  { name: "Davao City",     x: 250, y: 415 },
  { name: "CDO",            x: 190, y: 368 },
  { name: "Cebu City",      x: 208, y: 285 },
  { name: "Iloilo City",    x: 122, y: 278 },
  { name: "Legazpi City",   x: 195, y: 195 },
  { name: "Quezon City",    x: 148, y: 152 },
  { name: "Manila",         x: 128, y: 138 },
];

const P_HEX = ["#ff5f5f", "#3ecfb8", "#ffc93c"];

const QUESTIONS = [
  {t:"r", q:"What term describes the purposeful flow of people, goods, animals, and information across space and time?", opts:["Spatial interaction","Movement","Mobility","Connectivity"], a:"Movement"},
  {t:"r", q:"Waldo Tobler's First Law of Geography states:", opts:["All places are equally related to each other","Distant things are more related than near things","Near things are more related than distant things","Distance has no effect on spatial interaction"], a:"Near things are more related than distant things"},
  {t:"r", q:"COMPLEMENTARITY in spatial interaction refers to:", opts:["The ability of something to be moved","A location that offers an alternative destination","A demand in one place satisfied by supply in another","The ease of overcoming friction of distance"], a:"A demand in one place satisfied by supply in another"},
  {t:"r", q:"TRANSFERABILITY is best defined as:", opts:["Cost savings from clustering near similar firms","A demand satisfied by supply elsewhere","The ability of a thing or person to move or be moved","Time required to travel between two points"], a:"The ability of a thing or person to move or be moved"},
  {t:"r", q:"An INTERVENING OPPORTUNITY is:", opts:["A barrier that stops spatial interaction","The monetary cost of movement","A measure of physical distance","A location that offers an alternative to a destination"], a:"A location that offers an alternative to a destination"},
  {t:"r", q:"AGGLOMERATION ECONOMIES are the:", opts:["Cost savings from large-scale production alone","Spiraling buildup of regional advantages","Negative impacts on regions from others' growth","Benefits that come when firms and people locate near one another"], a:"Benefits that come when firms and people locate near one another"},
  {t:"r", q:"PLACE UTILITY is:", opts:["Making goods available when they are needed","The capacity of a service to satisfy a basic want","Cost savings from clustering near similar industries","Added value from transporting a commodity to where it is more useful"], a:"Added value from transporting a commodity to where it is more useful"},
  {t:"r", q:"BACKWASH EFFECTS (Myrdal) refer to:", opts:["Benefits of agglomeration for nearby firms","Empty return trips due to trade imbalances","Costs incurred before traffic passes","Negative impacts on one region from economic growth in another"], a:"Negative impacts on one region from economic growth in another"},
  {t:"r", q:"CUMULATIVE CAUSATION (Gunnar Myrdal) describes:", opts:["Decline in peripheral regional activity","Localization of specific industries in a region","Spread of economic activity outward","Spiraling buildup of advantages in specific geographic settings"], a:"Spiraling buildup of advantages in specific geographic settings"},
  {t:"r", q:"ACCESSIBILITY is:", opts:["The physical distance between two points","The ability to be transferred across space","Locations where demand is concentrated","The ease of overcoming the friction of distance"], a:"The ease of overcoming the friction of distance"},
  {t:"r", q:"ISOCHRONES are:", opts:["Paths of shortest distance on a curved surface","Economic measures of spatial separation","Physical barriers to movement","Time contours connecting points of equal travel time"], a:"Time contours connecting points of equal travel time"},
  {t:"r", q:"An ISOTROPIC SURFACE has:", opts:["Movement effort that varies by direction","Distance always measured in straight lines","Transport costs that increase non-linearly","Movement effort that is the same in all directions from every point"], a:"Movement effort that is the same in all directions from every point"},
  {t:"r", q:"Kevin Lynch's five elements of the Image of the City are:", opts:["Paths, Zones, Barriers, Signs, Centers","Roads, Areas, Boundaries, Markers, Hubs","Routes, Regions, Limits, Features, Points","Pathways, Districts, Edges, Landmarks, Nodes"], a:"Pathways, Districts, Edges, Landmarks, Nodes"},
  {t:"r", q:"ECONOMIC DISTANCE is:", opts:["The straight-line separation between two points","The time required to travel between two places","Psychological perception of distance","A budgetary notion of the energy required to move between two points"], a:"A budgetary notion of the energy required to move between two points"},
  {t:"r", q:"TRANSPORT COSTS are:", opts:["Prices paid by users of transport services","Fixed infrastructure costs only","Variable operating costs only","Costs internally assumed by providers of transport services"], a:"Costs internally assumed by providers of transport services"},
  {t:"r", q:"FIXED COSTS in transport are:", opts:["Costs that vary with volume of traffic","Only fuel and crew wage costs","Only terminal costs","Costs incurred before any traffic passes — inescapable costs"], a:"Costs incurred before any traffic passes — inescapable costs"},
  {t:"r", q:"In Weber's location theory, a Material Index (MI) greater than 1 means the industry should:", opts:["Locate near the market","Be footloose","Have distribution exceed assembly costs","Locate near the source of raw materials"], a:"Locate near the source of raw materials"},
  {t:"r", q:"COST-SPACE CONVERGENCE means:", opts:["Places getting closer in travel time","Physical reduction in distance","Psychological shrinking of perceived space","Places getting closer in monetary costs to overcome distance"], a:"Places getting closer in monetary costs to overcome distance"},
  {t:"r", q:"TIME-SPACE CONVERGENCE refers to:", opts:["Reduction in monetary costs of transport","Increase in speed of information","Convergence of economic and political spaces","The shrinking of time distance between places over time"], a:"The shrinking of time distance between places over time"},
  {t:"r", q:"TERRA COGNITA is:", opts:["The total geographic area of a region","The cognitive map of a city's landmarks","Perceptual distortion of distance","A small area in which a person can specify relative locations accurately"], a:"A small area in which a person can specify relative locations accurately"},
  {t:"r", q:"The MATERIAL INDEX formula is:", opts:["Weight of finished product ÷ weight of localized materials","Distribution costs ÷ assembly costs","Assembly costs ÷ distribution costs","Weight of localized materials ÷ weight of finished product"], a:"Weight of localized materials ÷ weight of finished product"},
  {t:"r", q:"Von Thünen's model holds that agricultural land use is primarily a function of:", opts:["Soil quality","Labor availability","Climate and rainfall","Distance from the market"], a:"Distance from the market"},
  {t:"r", q:"EMPTY BACKHAULS occur when:", opts:["A port has no outgoing freight","Fixed costs exceed variable costs","Transport rates exceed transport costs","Vehicles return without cargo due to trade imbalances"], a:"Vehicles return without cargo due to trade imbalances"},
  {t:"r", q:"RATES in transport geography are:", opts:["Costs assumed by transport providers","Fixed infrastructure costs","Variable costs of fuel and labor","The negotiated monetary cost of moving a unit between origin and destination"], a:"The negotiated monetary cost of moving a unit between origin and destination"},
  {t:"r", q:"In Reimann space, the shortest path between two points is called a:", opts:["Straight line","Isochrone","Topological path","Geodesic"], a:"Geodesic"},
  {t:"r", q:"ECONOMIES OF SCALE refer to:", opts:["Benefits from firms locating near each other","Cost savings from regional clustering","Negative impacts of growth on peripheral regions","Reduction in unit cost of production due to higher aggregate output"], a:"Reduction in unit cost of production due to higher aggregate output"},
  {t:"r", q:"GEOGRAPHICAL PATH DEPENDENCE is:", opts:["The shortest geographic route between two points","Dependency on natural resources","Influence of political boundaries on movement","The relationship between a place's current activities and its past experiences"], a:"The relationship between a place's current activities and its past experiences"},
  {t:"r", q:"TOPOLOGICAL TRANSFORMATIONS of maps are characterized by:", opts:["Perfectly scaled geographic representations","Logarithmic representation of perceived distance","True Euclidean distances between points","Maintaining connectivity and sequence, but not true scale or distance"], a:"Maintaining connectivity and sequence, but not true scale or distance"},
  {t:"r", q:"SOCIAL COSTS in transport are:", opts:["Costs incurred by operators only","Fixed infrastructure development costs","Costs paid directly by the user","Externalities not paid for by users — accidents, congestion, pollution, noise"], a:"Externalities not paid for by users — accidents, congestion, pollution, noise"},
  {t:"r", q:"In Minkowski space, what is the fourth dimension added to x, y, z?", opts:["Cost","Energy","Time (t)","Population"], a:"Time (t)"},
  {t:"r", q:"VARIABLE COSTS in transport are:", opts:["Costs incurred before any traffic passes","Infrastructure construction costs","Terminal and interchange costs","Costs that vary with the actual level of traffic — fuel, crew wages, maintenance"], a:"Costs that vary with the actual level of traffic — fuel, crew wages, maintenance"},
  {t:"r", q:"LOCALIZATION ECONOMIES are:", opts:["Benefits from firms locating near all industries","Cost savings for any firm in a city","Cost savings that accrue to specific industries by clustering at one location","Negative effects of over-concentration in one area"], a:"Cost savings that accrue to specific industries by clustering at one location"},
  {t:"s", q:"TRUE or FALSE:\nIn Reimann space, the shortest distance between two points is always a straight line.", opts:["TRUE","FALSE"], a:"FALSE", note:"Shortest distance in Reimann space is a curved line — a geodesic!"},
  {t:"s", q:"TRUE or FALSE:\nAccess is uniform for all, but accessibility varies according to one's location.", opts:["TRUE","FALSE"], a:"TRUE", note:"Access = the possibility to enter (uniform). Accessibility = relative to your location."},
  {t:"s", q:"Travel time from London to Edinburgh decreased from approximately ___ minutes in 1658 to less than 200 minutes in 1966.", opts:["5,000 min","10,000 min","20,000 min","50,000 min"], a:"20,000 min", note:"From 20,000 min by stagecoach to under 200 by airplane. That's time-space convergence!"},
  {t:"s", q:"TRUE or FALSE:\nIn Weber's theory, a Market-Oriented industry has DISTRIBUTION costs greater than ASSEMBLY costs.", opts:["TRUE","FALSE"], a:"TRUE", note:"Market-oriented: distribution > assembly. Material-oriented: assembly > distribution."},
  {t:"s", q:"TRUE or FALSE:\nMinkowski space is a special case of Reimann space applied to four dimensions.", opts:["TRUE","FALSE"], a:"TRUE", note:"Minkowski adds time (t) as the fourth dimension to Reimann's spatial framework."},
  {t:"s", q:"Which theorist conceptualized transport input as the movement of a unit of weight over a unit of distance?", opts:["Weber","Von Thünen","Isard","Myrdal"], a:"Isard", note:"Walter Isard treated transport as ton-miles and passenger-miles — an essential production input."},
  {t:"s", q:"TRUE or FALSE:\nTopological space preserves exact distances and scale between points.", opts:["TRUE","FALSE"], a:"FALSE", note:"Topological space preserves connectivity and sequence — NOT scale or exact distances!"},
  {t:"s", q:"In Weber's Material Index, a PURE MATERIAL has an MI equal to:", opts:["0","1","Greater than 1","Less than 0"], a:"1", note:"Pure materials have MI = 1 because the entire material weight becomes part of the finished product."},
];

let numP=2, names=["Player 1","Player 2","Player 3"], pos=[0,0,0], turn=0;
let deck=[], deckIdx=0, phase="draw", currentQ=null, selectedOpt=null;
let stealQueue=[], stealCurrent=null, winner=null, feedbackMsg="", feedbackGood=true;

function setPlayers(n) {
  numP=n;
  document.getElementById("btn2").classList.toggle("active",n===2);
  document.getElementById("btn3").classList.toggle("active",n===3);
  document.getElementById("p3row").style.display=n===3?"block":"none";
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildDeck() {
  const reg=shuffle(QUESTIONS.filter(q=>q.t==="r"));
  const sur=shuffle(QUESTIONS.filter(q=>q.t==="s"));
  const d=[];let si=0;
  reg.forEach((q,i)=>{d.push(q);if((i+1)%4===0&&si<sur.length)d.push(sur[si++]);});
  while(si<sur.length)d.push(sur[si++]);
  return d;
}

function startGame() {
  names=[
    document.getElementById("n0").value||"Player 1",
    document.getElementById("n1").value||"Player 2",
    document.getElementById("n2").value||"Player 3",
  ];
  pos=[0,0,0];turn=0;deck=buildDeck();deckIdx=0;
  phase="draw";currentQ=null;selectedOpt=null;winner=null;feedbackMsg="";
  document.getElementById("setup").style.display="none";
  document.getElementById("game").style.display="flex";
  drawMap();renderChips();renderRight();
}

function drawMap() {
  const pts=STOPS.map(s=>`${s.x},${s.y}`).join(" ");
  document.getElementById("routeLine").setAttribute("points",pts);
  const sg=document.getElementById("stopMarkers");
  sg.innerHTML="";
  STOPS.forEach((s,i)=>{
    const isStart=i===0,isEnd=i===STOPS.length-1;
    const col=isStart?"#22c55e":isEnd?"#ef4444":"#cdd9ef";
    sg.innerHTML+=`
      <circle cx="${s.x}" cy="${s.y}" r="5.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <text x="${s.x}" y="${s.y-9}" text-anchor="middle" fill="#cdd9ef" font-size="6" font-family="DM Sans,sans-serif">${s.name}</text>
      ${isStart?`<text x="${s.x}" y="${s.y+14}" text-anchor="middle" fill="#22c55e" font-size="5.5" font-weight="bold">START</text>`:""}
      ${isEnd?`<text x="${s.x}" y="${s.y+14}" text-anchor="middle" fill="#ef4444" font-size="5.5" font-weight="bold">FINISH</text>`:""}
    `;
  });
  updatePlayerPieces();
}

function updatePlayerPieces() {
  const pg=document.getElementById("playerPieces");
  pg.innerHTML="";
  names.slice(0,numP).forEach((_,i)=>{
    const s=STOPS[pos[i]];
    const offset=numP===2?(i===0?-7:7):(i===0?-10:i===1?0:10);
    const r=(turn===i&&phase!=="result")?9:8;
    const sw=turn===i?2:1;
    pg.innerHTML+=`
      <circle cx="${s.x+offset}" cy="${s.y}" r="${r}" fill="${P_HEX[i]}" stroke="#fff" stroke-width="${sw}"/>
      <text x="${s.x+offset}" y="${s.y+4}" text-anchor="middle" font-size="8" font-weight="bold" fill="#07111f" font-family="Bebas Neue,sans-serif">${i+1}</text>
    `;
  });
}

function renderChips() {
  document.getElementById("chips").innerHTML=names.slice(0,numP).map((name,i)=>`
    <div class="p-chip ${turn===i?"active":""}" style="border-color:${turn===i?P_HEX[i]:"var(--border)"}">
      <div class="p-dot" style="background:${P_HEX[i]}"></div>
      <span class="p-chip-name" style="color:${turn===i?P_HEX[i]:"var(--text)"}">${name}</span>
      <span class="p-chip-loc">${STOPS[pos[i]].name}</span>
    </div>
  `).join("");
}

function renderRight() {
  const pNames=names.slice(0,numP);
  let html=`
    <div class="turn-banner" style="border-left-color:${P_HEX[turn]}">
      <div class="turn-avatar" style="background:${P_HEX[turn]}">${turn+1}</div>
      <div>
        <div class="turn-label">Current Turn</div>
        <div class="turn-name" style="color:${P_HEX[turn]}">${pNames[turn]}</div>
      </div>
      <div class="turn-progress">Stop ${pos[turn]+1} / ${STOPS.length}</div>
    </div>
  `;
  if(phase==="draw"){
    html+=`<button class="draw-btn" style="background:${P_HEX[turn]}" onclick="drawCard()">✋ ${pNames[turn]}, Draw Your Card!</button>`;
  }
  if(currentQ&&(phase==="answer"||phase==="steal"||phase==="result")){
    if(currentQ.t==="s") html+=`<div class="surprise-badge">⚡ SURPRISE ROUND — Correct: +2 | Wrong: −1</div>`;
    if(phase==="steal"&&stealCurrent!==null) html+=`<div class="steal-badge">⚡ ${pNames[stealCurrent]}'s turn to steal!</div>`;
    const qText=currentQ.q.replace("TRUE or FALSE:\n","<b>TRUE or FALSE:</b><br>");
    html+=`<div class="q-box">${qText}</div>`;
    const whoPresses=phase==="answer"?turn:stealCurrent;
    const clickable=(phase==="answer"||phase==="steal")&&whoPresses!==null;
    html+=`<div class="opts">`;
    currentQ.opts.forEach((opt,j)=>{
      let cls="";
      if(phase==="result"){
        if(opt===currentQ.a) cls="correct";
        else if(opt===selectedOpt&&opt!==currentQ.a) cls="wrong";
      }
      const letters=["A","B","C","D"];
      html+=`<button class="opt-btn ${cls}" onclick="handleAnswer('${opt.replace(/'/g,"&#39;")}',${whoPresses})" ${!clickable||phase==="result"?"disabled":""}>
        <span class="opt-letter">${letters[j]}</span>${opt}</button>`;
    });
    html+=`</div>`;
    if(feedbackMsg){
      html+=`<div class="feedback ${feedbackGood?"good":"bad"}">${feedbackMsg}
        ${phase==="result"&&currentQ.note?`<div class="note">${currentQ.note}</div>`:""}</div>`;
    }
    if(winner!==null&&phase==="result"){
      html+=`<div class="win-banner" style="border-color:${P_HEX[winner]};background:${P_HEX[winner]}15">
        <div class="trophy">🏆</div>
        <div class="win-text" style="color:${P_HEX[winner]}">${pNames[winner]} reaches Manila!</div></div>`;
    }
    if(phase==="result"){
      html+=winner===null
        ?`<button class="next-btn" onclick="nextTurn()">Next Turn →</button>`
        :`<button class="next-btn" onclick="backToSetup()">🔄 Play Again</button>`;
    }
  }
  document.getElementById("rightPanel").innerHTML=html;
}

function drawCard() {
  if(deckIdx>=deck.length){deck=buildDeck();deckIdx=0;}
  currentQ=deck[deckIdx++];
  selectedOpt=null;feedbackMsg="";phase="answer";
  renderRight();
}

function handleAnswer(opt,playerIdx) {
  selectedOpt=opt;
  const pNames=names.slice(0,numP);
  const correct=opt===currentQ.a;
  if(phase==="answer"){
    if(correct){
      const add=currentQ.t==="s"?2:1;
      pos[playerIdx]=Math.min(pos[playerIdx]+add,STOPS.length-1);
      feedbackMsg=`✅ Correct! ${pNames[playerIdx]} moves ${add===2?"2 stops forward!":"1 stop forward!"}`;
      feedbackGood=true;
      if(pos[playerIdx]>=STOPS.length-1) winner=playerIdx;
    } else {
      if(currentQ.t==="s"){
        pos[playerIdx]=Math.max(pos[playerIdx]-1,0);
        feedbackMsg=`❌ Wrong! ${pNames[playerIdx]} moves back 1 stop.<br>Correct answer: ${currentQ.a}`;
        feedbackGood=false;
      } else {
        stealQueue=[];
        for(let i=1;i<numP;i++) stealQueue.push((turn+i)%numP);
        stealCurrent=stealQueue[0];
        selectedOpt=null;
        feedbackMsg=`❌ Wrong! Time to steal!`;feedbackGood=false;
        phase="steal";renderRight();return;
      }
    }
    phase="result";
  } else if(phase==="steal"){
    if(correct){
      pos[playerIdx]=Math.min(pos[playerIdx]+1,STOPS.length-1);
      feedbackMsg=`⚡ ${pNames[playerIdx]} stole the point and moves forward!`;feedbackGood=true;
      if(pos[playerIdx]>=STOPS.length-1) winner=playerIdx;
    } else {
      stealQueue=stealQueue.filter(i=>i!==playerIdx);
      if(stealQueue.length>0){
        stealCurrent=stealQueue[0];selectedOpt=null;
        feedbackMsg=`❌ Wrong steal by ${pNames[playerIdx]}!`;feedbackGood=false;
        renderRight();return;
      }
      feedbackMsg=`❌ No one got it! Correct answer: ${currentQ.a}`;feedbackGood=false;
    }
    phase="result";
  }
  updatePlayerPieces();renderChips();renderRight();
}

function nextTurn() {
  turn=(turn+1)%numP;phase="draw";currentQ=null;selectedOpt=null;
  feedbackMsg="";stealQueue=[];stealCurrent=null;
  renderChips();renderRight();updatePlayerPieces();
}

function backToSetup() {
  document.getElementById("game").style.display="none";
  document.getElementById("setup").style.display="flex";
}
</script>
</body>
</html>
