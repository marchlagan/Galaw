<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAW! </title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap');
  :root {
    --bg:#070d1a; --surface:#0e1a2e; --surface2:#162035; --border:#1e3050;
    --p1:#ff5f5f; --p2:#3ecfb8; --p3:#ffc93c;
    --gold:#ffc93c; --muted:#4a6080; --text:#cdd9ef; --white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);  width: 100%; height: 100%;
  margin: 0;
  padding: 0;
  overflow-y: auto;}

  /* ── SETUP ── */
  #setup{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:150vh;padding:24px;
    background:radial-gradient(ellipse at 30% 20%,#0d2a4a 0%,var(--bg) 70%);}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:5rem;color:var(--gold);letter-spacing:12px;line-height:1;}
  .logo-sub{color:var(--muted);font-size:.78rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:36px;}
  .setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:400px;}
  .section-label{font-size:.68rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .player-toggle{display:flex;gap:8px;margin-bottom:24px;}
  .toggle-btn{flex:1;padding:11px;border-radius:8px;border:1.5px solid var(--border);
    background:transparent;color:var(--muted);font-family:'Bebas Neue',sans-serif;
    font-size:1.1rem;letter-spacing:2px;cursor:pointer;transition:all .2s;}
  .toggle-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(255,201,60,.08);}
  .name-row{margin-bottom:12px;}
  .name-label{font-size:.7rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
  .name-input{width:100%;padding:9px 13px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;}
  .name-input:focus{border-color:var(--gold);}
  .start-btn{width:100%;margin-top:12px;padding:14px;background:var(--gold);color:var(--bg);
    font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:4px;
    border:none;border-radius:10px;cursor:pointer;transition:opacity .2s;}
  .start-btn:hover{opacity:.9;}
  .how-to{margin-top:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:16px 20px;max-width:400px;width:100%;
    font-size:.82rem;color:var(--muted);line-height:2;}
  .how-to strong{color:var(--text);display:block;margin-bottom:4px;}

  /* ── GAME ── */
  #game{display:none;flex-direction:column;height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;gap:12px;}
  .game-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--gold);letter-spacing:4px;}
  .q-counter{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--muted);
    letter-spacing:2px;background:var(--bg);padding:4px 12px;
    border-radius:20px;border:1px solid var(--border);transition:all .3s;white-space:nowrap;}
  .q-counter.urgent{color:var(--gold);border-color:var(--gold);}
  .player-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .p-chip{display:flex;align-items:center;gap:6px;padding:5px 11px;
    border-radius:20px;border:1.5px solid var(--border);font-size:.78rem;transition:all .3s;}
  .p-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .p-chip-name{font-weight:600;}
  .p-chip-loc{color:var(--muted);font-size:.7rem;}
  .main-area{display:flex;flex:1;overflow:hidden;min-height:0;}
  .map-panel { width: 400px; min-width: 400px; padding: 10px; flex-shrink: 0; }
  .map-panel svg{width:100%;height:100%;}
  .right-panel{flex:1;padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
  .turn-banner{padding:11px 15px;border-radius:10px;background:var(--surface2);
    border-left:4px solid #fff;display:flex;align-items:center;gap:12px;}
  .turn-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--bg);flex-shrink:0;}
  .turn-label{font-size:.65rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .turn-name{font-weight:700;font-size:1rem;}
  .turn-progress{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap;}
  .draw-btn{padding:20px;border-radius:14px;border:none;
    font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;
    cursor:pointer;transition:transform .15s,opacity .15s;color:var(--bg);}
  .draw-btn:hover{transform:scale(1.02);}

  /* ── ROUND BADGES ── */
  .badge{padding:8px 14px;border-radius:8px;text-align:center;
    font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:#fff;}
  .badge-surprise{background:linear-gradient(135deg,#5b21b6,#7c3aed);}
  .badge-steal{background:linear-gradient(135deg,#92400e,#d97706);}
  .badge-power{background:linear-gradient(135deg,#1e3a5f,#2563eb);}
  .badge-sabotage{background:linear-gradient(135deg,#7f1d1d,#dc2626);}
  .badge-double{background:linear-gradient(135deg,#78350f,#f59e0b);}
  .badge-shortcut{background:linear-gradient(135deg,#064e3b,#059669);}

  /* ── QUESTION ── */
  .q-box{background:var(--surface2);border:1px solid var(--border);
    border-radius:12px;padding:15px 17px;line-height:1.65;font-size:.92rem;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt-btn{padding:10px 13px;border-radius:8px;border:1.5px solid var(--border);
    background:var(--surface2);color:var(--text);text-align:left;cursor:pointer;
    font-family:'DM Sans',sans-serif;font-size:.88rem;
    display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s;}
  .opt-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(255,201,60,.05);}
  .opt-btn:disabled{cursor:default;}
  .opt-btn.correct{border-color:#16a34a;background:#052e16;color:#4ade80;}
  .opt-btn.wrong{border-color:#dc2626;background:#2d0707;color:#f87171;}
  .opt-letter{min-width:24px;height:24px;border-radius:50%;background:var(--border);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:.72rem;font-weight:700;color:var(--muted);flex-shrink:0;}
  .feedback{padding:11px 14px;border-radius:8px;background:var(--surface2);
    border:1px solid var(--border);font-size:.88rem;line-height:1.6;}
  .feedback.good{color:#4ade80;border-color:#16a34a33;}
  .feedback.bad{color:#f87171;border-color:#dc262633;}
  .note{color:var(--muted);font-size:.8rem;margin-top:5px;}

  /* ── SABOTAGE SELECT ── */
  .sabotage-targets{display:flex;flex-direction:column;gap:8px;}
  .target-btn{padding:12px 16px;border-radius:8px;border:1.5px solid #dc2626;
    background:#2d0707;color:#f87171;cursor:pointer;font-family:'DM Sans',sans-serif;
    font-size:.9rem;font-weight:600;transition:background .15s;}
  .target-btn:hover{background:#450a0a;}

  /* ── WIN / FINAL ── */
  .win-banner{padding:16px;border-radius:12px;text-align:center;border:2px solid;}
  .win-banner .trophy{font-size:2rem;}
  .win-banner .win-text{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;}
  .standings{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .standings-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;
    color:var(--gold);margin-bottom:12px;text-align:center;}
  .standings-row{display:flex;align-items:center;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--border);}
  .standings-row:last-child{border-bottom:none;}
  .s-rank{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--muted);width:24px;}
  .s-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .s-name{font-weight:600;flex:1;}
  .s-pos{font-size:.8rem;color:var(--muted);}
  .s-stops{font-family:'Bebas Neue',sans-serif;font-size:1rem;}

  .next-btn{padding:13px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);
    font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:3px;
    cursor:pointer;width:100%;transition:opacity .2s;}
  .next-btn:hover{opacity:.9;}

  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<!-- ══ SETUP ══════════════════════════════════════════════════ -->
<div id="setup">
  <div class="logo">GALAW!</div>
  <div class="logo-sub">Geography of Movement · galaw para di pumanaw! — Trivia Race</div>
  <div class="setup-card">
    <div class="section-label">Number of Players</div>
    <div class="player-toggle">
      <button class="toggle-btn active" id="btn2" onclick="setPlayers(2)">2 Players</button>
      <button class="toggle-btn" id="btn3" onclick="setPlayers(3)">3 Players</button>
    </div>
    <div class="name-row">
      <label class="name-label"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5f5f;margin-right:8px;"></span>Player 1</label>
      <input class="name-input" id="n0" value="Player 1"/>
    </div>
    <div class="name-row">
      <label class="name-label"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ecfb8;margin-right:8px;"></span>Player 2</label>
      <input class="name-input" id="n1" value="Player 2"/>
    </div>
    <div class="name-row" id="p3row" style="display:none">
      <label class="name-label"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffc93c;margin-right:8px;"></span>Player 3</label>
      <input class="name-input" id="n2" value="Player 3"/>
    </div>
    <button class="start-btn" onclick="startGame()">🚦 START RACE</button>
  </div>
  <div class="how-to">
    <strong>HOW TO PLAY — 20 QUESTIONS TOTAL</strong>
    ✅ Correct → +1 stop <br> 
    ❌ Wrong → other players steal (+1)<br>
    ⚡ Surprise Round: Correct = +2 | Wrong = −1 | No steal<br>
    🏁 Reach Baguio OR lead after 20 questions to win!
  </div>
</div>

<script>
  //timer
  let timerInterval=null, timeLeft=10;
  function startTimer(){
  stopTimer();
  timeLeft=10;
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){ stopTimer(); onTimerExpired(); }
  },1000);
}
  
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
}
  
function updateTimerDisplay(){
  const el=document.getElementById('timerCount');
  const bar=document.getElementById('timerFill');
  const col=timeLeft<=3?'#ef4444':timeLeft<=5?'#ffc93c':'#22c55e';
  if(el){ el.textContent=timeLeft; el.style.color=col; }
  if(bar){ bar.style.width=(timeLeft/10*100)+'%'; bar.style.background=col; }
}

  function onTimerExpired(){
  if(!currentQ||phase==='draw'||phase==='result') return;
  const wrongOpt=currentQ.opts.find(o=>o!==currentQ.a);
  if(phase==='steal'){
    handleAnswer(wrongOpt, stealCurrent);
  } else {
    handleAnswer(wrongOpt, turn);
  }
}

// ══ STATE ═════════════════════════════════════════════════════
let numP=2, names=["Player 1","Player 2","Player 3"], pos=[0,0,0], turn=0;
let deck=[], deckIdx=0, questionCount=0;
let phase="draw"; // draw | answer | steal | sabotage_select | result
let currentQ=null, selectedOpt=null;
let stealQueue=[], stealCurrent=null;
let winner=null, gameOver=false;
let feedbackMsg="", feedbackGood=true;

// ══ SETUP ═════════════════════════════════════════════════════
function setPlayers(n){
  numP=n;
  document.getElementById("btn2").classList.toggle("active",n===2);
  document.getElementById("btn3").classList.toggle("active",n===3);
  document.getElementById("p3row").style.display=n===3?"block":"none";
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildDeck(){
  return shuffle(QUESTIONS).slice(0,20);
}

// ══ GAME START ════════════════════════════════════════════════
function startGame(){
  names=[
    document.getElementById("n0").value||"Player 1",
    document.getElementById("n1").value||"Player 2",
    document.getElementById("n2").value||"Player 3",
  ];
  pos=[0,0,0]; turn=0; questionCount=0; gameOver=false; winner=null;
  deck=buildDeck(); deckIdx=0;
  phase="draw"; currentQ=null; selectedOpt=null; feedbackMsg="";
  stealQueue=[]; stealCurrent=null;
  document.getElementById("setup").style.display="none";
  document.getElementById("game").style.display="flex";
  drawMap(); renderChips(); renderRight(); updateQCounter();
}

// ══ MAP ═══════════════════════════════════════════════════════
function drawMap(){
  document.getElementById("routeLine").setAttribute("points",STOPS.map(s=>`${s.x},${s.y}`).join(" "));
  const sg=document.getElementById("stopMarkers");
  sg.innerHTML="";
  STOPS.forEach((s,i)=>{
    const col=i===0?"#22c55e":i===STOPS.length-1?"#ef4444":"#cdd9ef";
    sg.innerHTML+=`
      <circle cx="${s.x}" cy="${s.y}" r="5.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>
      <text x="${s.x}" y="${s.y-9}" text-anchor="middle" fill="#cdd9ef" font-size="6" font-family="DM Sans,sans-serif">${s.name}</text>
      ${i===0?`<text x="${s.x}" y="${s.y+14}" text-anchor="middle" fill="#22c55e" font-size="5.5" font-weight="bold">START</text>`:""}
      ${i===STOPS.length-1?`<text x="${s.x}" y="${s.y+14}" text-anchor="middle" fill="#ef4444" font-size="5.5" font-weight="bold">FINISH</text>`:""}
    `;
  });
  updatePlayerPieces();
}

function updatePlayerPieces(){
  const pg=document.getElementById("playerPieces");
  pg.innerHTML="";
  names.slice(0,numP).forEach((_,i)=>{
    const s=STOPS[pos[i]];
    const offset=numP===2?(i===0?-7:7):(i===0?-10:i===1?0:10);
    const r=(turn===i&&phase!=="result")?9:8;
    pg.innerHTML+=`
      <circle cx="${s.x+offset}" cy="${s.y}" r="${r}" fill="${P_HEX[i]}" stroke="#fff" stroke-width="${turn===i?2:1}"/>
      <text x="${s.x+offset}" y="${s.y+4}" text-anchor="middle" font-size="8" font-weight="bold" fill="#07111f" font-family="Bebas Neue,sans-serif">${i+1}</text>
    `;
  });
}

function renderChips(){
  document.getElementById("chips").innerHTML=names.slice(0,numP).map((name,i)=>`
    <div class="p-chip${turn===i?" active":""}" style="border-color:${turn===i?P_HEX[i]:"var(--border)"}">
      <div class="p-dot" style="background:${P_HEX[i]}"></div>
      <span class="p-chip-name" style="color:${turn===i?P_HEX[i]:"var(--text)"}">${name}</span>
      <span class="p-chip-loc">${STOPS[pos[i]].name}</span>
    </div>
  `).join("");
}

function updateQCounter(){
  const el=document.getElementById("qCounter");
  if(!el) return;
  el.textContent=`Q ${questionCount} / 20`;
  el.classList.toggle("urgent", questionCount>=15);
}

function updateAll(){
  updatePlayerPieces(); renderChips(); renderRight(); updateQCounter();
}

// ══ RIGHT PANEL ═══════════════════════════════════════════════
function renderRight(){
  const pNames=names.slice(0,numP);
  let html=`
    <div class="turn-banner" style="border-left-color:${P_HEX[turn]}">
      <div class="turn-avatar" style="background:${P_HEX[turn]}">${turn+1}</div>
      <div>
        <div class="turn-label">Current Turn</div>
        <div class="turn-name" style="color:${P_HEX[turn]}">${pNames[turn]}</div>
      </div>
      <div class="turn-progress">Stop ${pos[turn]+1} / ${STOPS.length}</div>
    </div>
  `;

  if(phase==="draw"){
    html+=`<button class="draw-btn" style="background:${P_HEX[turn]}" onclick="drawCard()">✋ ${pNames[turn]}, Draw Your Card!</button>`;
  }

  if(currentQ&&(phase==="answer"||phase==="steal"||phase==="sabotage_select"||phase==="result")){
    // Badge
    if(currentQ.t==="s") html+=`<div class="badge badge-surprise">⚡ SURPRISE ROUND — Correct: +2 | Wrong: −1 | No Steal</div>`;
    if(currentQ.t==="b"){
      const bMap={
        power_surge:["badge-power","⚡ POWER SURGE — Correct: +3 | Wrong: −1 | No Steal"],
        sabotage:["badge-sabotage","💣 SABOTAGE — Correct: Send opponent back 1 | Wrong: −1"],
        double_up:["badge-double","🎯 DOUBLE UP — Correct: +2 | Wrong: −2 | High Risk!"],
        shortcut:["badge-shortcut","🚀 SHORTCUT — Correct: Catch up to leader | Wrong: Stay"],
      };
      const [cls,label]=bMap[currentQ.bonusType]||["badge-power","⚡ BONUS ROUND"];
      html+=`<div class="badge ${cls}">${label}</div>`;
    }
    if(phase==="steal"&&stealCurrent!==null)
      html+=`<div class="badge badge-steal">⚡ ${pNames[stealCurrent]}'s turn to steal!</div>`;

    // Question text
    const qText=currentQ.q.replace("TRUE or FALSE:\n","<b>TRUE or FALSE:</b><br>");
    html+=`<div class="q-box">${qText}</div>
<div style="display:flex;align-items:center;gap:10px;margin:6px 0 4px;">
  <div style="flex:1;height:7px;background:#1e3050;border-radius:4px;overflow:hidden;">
    <div id="timerFill" style="height:100%;width:100%;border-radius:4px;background:#22c55e;transition:width 0.9s linear,background 0.3s;"></div>
  </div>
  <div id="timerCount" style="font-family:monospace;font-size:1rem;font-weight:700;color:#22c55e;min-width:22px;text-align:right;">10</div>
</div>`;

    // Sabotage target selection
    if(phase==="sabotage_select"){
      html+=`<div class="sabotage-targets">
        <p style="color:#f87171;font-size:.85rem;margin-bottom:8px;font-weight:600;">💣 Choose your target:</p>
        ${pNames.map((_,i)=>i!==turn?`
          <button class="target-btn" onclick="handleSabotage(${i})">
            💣 Send <strong>${pNames[i]}</strong> back 1 stop
          </button>`:"").join("")}
      </div>`;
    } else {
      // Answer options
      const whoPresses=phase==="answer"?turn:stealCurrent;
      const clickable=(phase==="answer"||phase==="steal")&&whoPresses!==null;
      html+=`<div class="opts">`;
      currentQ.opts.forEach((opt,j)=>{
        let cls="";
        if(phase==="result"){
          if(opt===currentQ.a) cls="correct";
          else if(opt===selectedOpt&&opt!==currentQ.a) cls="wrong";
        }
        const letters=["A","B","C","D"];
        const safeOpt=opt.replace(/'/g,"&#39;");
        html+=`<button class="opt-btn ${cls}"
          onclick="${clickable&&phase!=='result'?`handleAnswer('${safeOpt}',${whoPresses})`:''}"
          ${!clickable||phase==="result"?"disabled":""}>
          <span class="opt-letter">${letters[j]}</span>${opt}
        </button>`;
      });
      html+=`</div>`;
    }

    // Feedback
    if(feedbackMsg){
      html+=`<div class="feedback ${feedbackGood?"good":"bad"}">${feedbackMsg}
        ${phase==="result"&&currentQ.note?`<div class="note">${currentQ.note}</div>`:""}</div>`;
    }

    // Result phase actions
    if(phase==="result"){
      if(winner!==null){
        // Manila winner
        html+=`<div class="win-banner" style="border-color:${P_HEX[winner]};background:${P_HEX[winner]}15">
          <div class="trophy">🏆</div>
          <div class="win-text" style="color:${P_HEX[winner]}">${pNames[winner]} reaches Baguio!</div>
        </div>
        <button class="next-btn" onclick="backToSetup()">🔄 Play Again</button>`;
     } else if(questionCount>=20){
        // End by question limit
        const standings=pNames.map((n,i)=>({n,i,p:pos[i]})).sort((a,b)=>b.p-a.p);
        const topPos=standings[0].p;
        const topPlayers=standings.filter(s=>s.p===topPos);
        const winText=topPlayers.length>1
          ?`🤝 TIE — ${topPlayers.map(s=>s.n).join(" & ")}!`
          :`🏆 ${standings[0].n} wins!`;
        html+=`<div class="standings">
          <div class="standings-title">🏁 GAME OVER — 20 Questions Done!</div>
          <div style="text-align:center;font-family:'Bebas Neue';font-size:1.2rem;color:var(--gold);margin-bottom:12px;">${winText}</div>
          ${standings.map((s,rank)=>`
            <div class="standings-row">
              <span class="s-rank">${rank+1}</span>
              <span class="s-dot" style="background:${P_HEX[s.i]}"></span>
              <span class="s-name" style="color:${P_HEX[s.i]}">${s.n}</span>
              <span class="s-pos">${STOPS[s.p].name}</span>
              <span class="s-stops" style="color:${P_HEX[s.i]}">Stop ${s.p+1}</span>
            </div>`).join("")}
        </div>
        <button class="next-btn" onclick="backToSetup()">🔄 Play Again</button>`;
      } else {
        html+=`<button class="next-btn" onclick="nextTurn()">Next Turn →</button>`;
      }
    }
  }

  document.getElementById("rightPanel").innerHTML=html;
}

// ══ GAME ACTIONS ══════════════════════════════════════════════
function drawCard(){
  if(questionCount>=20||gameOver) return;
  questionCount++;
  currentQ=deck[deckIdx++]||deck[0];
  selectedOpt=null; feedbackMsg=""; phase="answer";
  updateAll();
  setTimeout(startTimer,50);
  
}

function handleAnswer(opt,playerIdx){
  stopTimer();
  selectedOpt=opt;
  const correct=opt===currentQ.a;
  if(phase==="answer"){
    if(currentQ.t==="b")      handleBonusAnswer(correct,playerIdx);
    else if(currentQ.t==="s") handleSurpriseAnswer(correct,playerIdx);
    else                       handleRegularAnswer(correct,playerIdx);
  } else if(phase==="steal"){
    handleStealAnswer(correct,playerIdx);
  }
}

function handleRegularAnswer(correct,playerIdx){
  const pNames=names.slice(0,numP);
  if(correct){
    pos[playerIdx]=Math.min(pos[playerIdx]+1,STOPS.length-1);
    feedbackMsg=`✅ Correct! ${pNames[playerIdx]} moves 1 stop forward!`;
    feedbackGood=true;
    checkWin(playerIdx);
    phase="result";
  } else {
    stealQueue=[];
    for(let i=1;i<numP;i++) stealQueue.push((turn+i)%numP);
    stealCurrent=stealQueue[0];
    selectedOpt=null;
    feedbackMsg=`❌ Wrong! Time to steal!`; feedbackGood=false;
    phase="steal";
  }
  updateAll();
}

function handleSurpriseAnswer(correct,playerIdx){
  const pNames=names.slice(0,numP);
  if(correct){
    pos[playerIdx]=Math.min(pos[playerIdx]+2,STOPS.length-1);
    feedbackMsg=`⚡ Correct! ${pNames[playerIdx]} moves 2 stops forward!`;
    feedbackGood=true;
    checkWin(playerIdx);
  } else {
    pos[playerIdx]=Math.max(pos[playerIdx]-1,0);
    feedbackMsg=`❌ Wrong! ${pNames[playerIdx]} moves back 1 stop.<br><span class="note">Correct answer: ${currentQ.a}</span>`;
    feedbackGood=false;
  }
  phase="result"; updateAll();
}

function handleBonusAnswer(correct,playerIdx){
  const pNames=names.slice(0,numP);
  const bType=currentQ.bonusType;
  if(correct){
    if(bType==="power_surge"){
      pos[playerIdx]=Math.min(pos[playerIdx]+3,STOPS.length-1);
      feedbackMsg=`⚡ POWER SURGE! ${pNames[playerIdx]} rockets forward 3 stops!`;
      feedbackGood=true;
      checkWin(playerIdx); phase="result";
    } else if(bType==="sabotage"){
      feedbackMsg=`💣 ${pNames[playerIdx]} answered correctly! Choose your target!`;
      feedbackGood=true;
      phase="sabotage_select";
    } else if(bType==="double_up"){
      pos[playerIdx]=Math.min(pos[playerIdx]+2,STOPS.length-1);
      feedbackMsg=`🎯 DOUBLE UP! ${pNames[playerIdx]} moves 2 stops forward!`;
      feedbackGood=true;
      checkWin(playerIdx); phase="result";
    } else if(bType==="shortcut"){
      const maxP=Math.max(...pos.slice(0,numP));
      if(pos[playerIdx]>=maxP){
        pos[playerIdx]=Math.min(pos[playerIdx]+2,STOPS.length-1);
        feedbackMsg=`🚀 SHORTCUT! ${pNames[playerIdx]} is already the leader — zooms ahead 2 more stops!`;
      } else {
        pos[playerIdx]=maxP;
        feedbackMsg=`🚀 SHORTCUT! ${pNames[playerIdx]} teleports to the leader's position!`;
      }
      feedbackGood=true;
      checkWin(playerIdx); phase="result";
    }
  } else {
    if(bType==="double_up"){
      pos[playerIdx]=Math.max(pos[playerIdx]-2,0);
      feedbackMsg=`❌ BUST! ${pNames[playerIdx]} moves back 2 stops. High risk, high loss!<br><span class="note">Correct answer: ${currentQ.a}</span>`;
    } else if(bType==="shortcut"){
      feedbackMsg=`❌ Wrong! ${pNames[playerIdx]} stays put.<br><span class="note">Correct answer: ${currentQ.a}</span>`;
    } else {
      pos[playerIdx]=Math.max(pos[playerIdx]-1,0);
      feedbackMsg=`❌ Wrong! ${pNames[playerIdx]} moves back 1 stop.<br><span class="note">Correct answer: ${currentQ.a}</span>`;
    }
    feedbackGood=false;
    phase="result";
  }
  updateAll();
}

function handleSabotage(targetIdx){
  const pNames=names.slice(0,numP);
  pos[targetIdx]=Math.max(pos[targetIdx]-1,0);
  feedbackMsg=`💣 ${pNames[turn]} sabotaged ${pNames[targetIdx]}! They move back 1 stop!`;
  feedbackGood=true;
  phase="result";
  updateAll();
}

function handleStealAnswer(correct,playerIdx){
  setTimeout(startTimer,50);
  
  const pNames=names.slice(0,numP);
  if(correct){
    pos[playerIdx]=Math.min(pos[playerIdx]+1,STOPS.length-1);
    feedbackMsg=`⚡ ${pNames[playerIdx]} stole the point and moves forward!`;
    feedbackGood=true;
    checkWin(playerIdx);
    phase="result";
  } else {
    stealQueue=stealQueue.filter(i=>i!==playerIdx);
    if(stealQueue.length>0){
      stealCurrent=stealQueue[0];
      selectedOpt=null;
      feedbackMsg=`❌ Wrong steal by ${pNames[playerIdx]}!`; feedbackGood=false;
      updateAll(); return;
    }
    feedbackMsg=`❌ No one got it! Correct answer: ${currentQ.a}`; feedbackGood=false;
    phase="result";
  }
  updateAll();
}

function checkWin(playerIdx){
  if(pos[playerIdx]>=STOPS.length-1){
    winner=playerIdx; gameOver=true;
  }
}

function nextTurn(){
  if(questionCount>=20||gameOver){ updateAll(); return; }
  turn=(turn+1)%numP;
  phase="draw"; currentQ=null; selectedOpt=null; feedbackMsg="";
  stealQueue=[]; stealCurrent=null;
  renderChips(); renderRight(); updatePlayerPieces(); updateQCounter();
}

function backToSetup(){
  document.getElementById("game").style.display="none";
  document.getElementById("setup").style.display="flex";
}
</script>
